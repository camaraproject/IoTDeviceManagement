openapi: 3.0.3
info:
  title: eSIM Profile Management API
  description: |
    Developer-friendly eSIM Profile Management API

    # Introduction

    eSIM (embedded SIM) technology allows remote provisioning and management of cellular connectivity without physical SIM card replacement. The CAMARA eSIM Profile Management API provides a unified interface for eSIM Profile lifecycle operations including download, enable, disable, delete, and fallback configuration.

    The target of the eSIM Profile operations is typically the eUICC on the device (as opposed to the cellular network).

    **Terminology Note**: In this API, "eSIM Profile" refers to downloadable connectivity configurations installed on eSIM hardware (eUICC). "eSIM" refers to the hardware itself.

    **Key roles**

    | **Role Name** | **Description** |
    | ---- | ------- |
    | API Consumer | The entity that consumes the eSIM Profile Management APIs |
    | API Provider | The entity that provides the eSIM Profile Management APIs |
    | Network Provider | The entity that provides the physical network resources and eSIM Profile platform |
    | Device Owner | The entity that owns or manages the devices containing eSIM hardware |

    ## Operation-Specific Identification

    - **Download**: Requires EID (target device) and activationCode. ICCID is assigned during download and returned in response.
    - **Enable/Disable/Delete**: Requires ICCID; EID may optionally be supplied to identify the target eUICC directly.
    - **Set-Fallback**: Requires ICCID; EID may optionally be supplied to identify the target eUICC directly.
    - **Status**: Accepts EID (all profiles on device), ICCID (specific profile), or both (specific profile, pairing asserted)

    The ICCID identifies the target eSIM Profile; supplying the EID as well is always optional. It serves two purposes: as a routing hint, letting the provider act on the target device directly without first resolving which device holds the ICCID (a step IoT deployments often avoid to conserve device data and energy); and as a defensive assertion of the pairing. If the ICCID is not installed on the identified EID, the request is rejected with `422 ESIM_PROFILE_MANAGEMENT.IDENTIFIER_MISMATCH`. See the API documentation for details.

    # Operation Lifecycle

    1. **Download**: Install eSIM Profile to device in DISABLED state.
    2. **Enable**: Enable downloaded eSIM Profile for connectivity (only one active per device)
    3. **Disable**: Disable eSIM Profile (device loses connectivity, eSIM Profile remains installed)
    4. **Delete**: Permanently remove eSIM Profile from device (irreversible)
    5. **Set-Fallback**: Configure backup eSIM Profile for automatic failover

    # States of eSIMs

    eSIMs have two states: DISABLED and ENABLED.

    - DISABLED: eSIM installed but not active
    - ENABLED: eSIM active and providing connectivity
    - Only one eSIM can be enabled per device (per eUICC on the device)
    - Deletion permanently removes the eSIM

    # Pre-requisites

    Before using the eSIM Profile Management API, the API Consumer must establish a relationship with an API Provider. In particular:

    - The API Consumer is responsible for choosing and contacting an API Provider that fulfils their requirements.
    - Agreements must be in place between the API Consumer and API Provider covering service plans and connectivity options, geographic coverage areas, device compatibility requirements, and terms and conditions including pricing.
    - The `activationCode` used in the `/download` operation is obtained from the API Provider and is therefore API Provider specific.
    - The API Provider is responsible for telling the API Consumer the FQDN of their `esim-profile-management` API.

    This preparation phase is **outside the scope** of the eSIM Profile Management API.

    All operations act on the device over-the-air (download, enable, disable, delete, set-fallback). The target device must therefore be reachable, with working IP connectivity, when an operation runs. Download is the notable case. It may deliver the device's first eSIM Profile, so that initial connectivity has to come from another bearer, such as an existing profile, a bootstrap profile, or Wi-Fi. This API does not provide that connectivity. If the device is not reachable while an operation runs, the operation completes with a `FAILED` outcome rather than being rejected up front.

    # Operation states

    Operations that act on the device (download, enable, disable, delete, set-fallback) are asynchronous. A request is either rejected synchronously with a 4xx (no `operationId` issued), or accepted with `202`, an `operationId`, and `status: ACCEPTED`.

    Once accepted, `status` moves from `ACCEPTED` to `COMPLETED`, which is terminal. The final result is carried in `result.outcome` (`SUCCESS` or `FAILED`), and a failure is described by `result.failureReason`. Which failures are detected before acceptance versus reported on the operation may evolve in future versions.

    The API Consumer must poll GET /operations/{operationId} to observe completion. A `COMPLETED` operation is retrievable only for a provider-defined period, after which the endpoint returns `404`. Callbacks and event notifications are planned in future versions.

    <!-- CAMARA:MANDATORY:authorization-and-authentication:BEGIN -->

    # Authorization and authentication

    The "Camara Security and Interoperability Profile" provides details of how an API consumer requests an access token. Please refer to Identity and Consent Management (https://github.com/camaraproject/IdentityAndConsentManagement/) for the released version of the profile.

    The specific authorization flows to be used will be agreed upon during the onboarding process, happening between the API consumer and the API provider, taking into account the declared purpose for accessing the API, whilst also being subject to the prevailing legal framework dictated by local legislation.

    In cases where personal data is processed by the API and users can exercise their rights through mechanisms such as opt-in and/or opt-out, the use of three-legged access tokens is mandatory. This ensures that the API remains in compliance with privacy regulations, upholding the principles of transparency and user-centric privacy-by-design.
    <!-- CAMARA:MANDATORY:authorization-and-authentication:END -->

    <!-- CAMARA:MANDATORY:additional-error-responses:BEGIN -->

    # Additional CAMARA error responses

    The list of error codes in this API specification is not exhaustive. Therefore the API specification MAY not document some non-mandatory error statuses as indicated in `CAMARA API Design Guide`.

    Please refer to the `CAMARA_common.yaml` of the Commonalities Release associated to this API version for a complete list of error responses. The applicable Commonalities Release can be identified in the `API Readiness Checklist` document associated to this API version.

    As a specific rule, error `501 - NOT_IMPLEMENTED` can be only a possible error response if it is explicitly documented in the API.
    <!-- CAMARA:MANDATORY:additional-error-responses:END -->

    <!-- CAMARA:MANDATORY:request-body-strictness:BEGIN -->

    # Request body strictness

    This API rejects requests with JSON request bodies that contain properties not declared in this specification, at any nesting level. Unknown properties result in a `400 INVALID_ARGUMENT` response.
    <!-- CAMARA:MANDATORY:request-body-strictness:END -->

